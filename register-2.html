<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tournament Registration</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <header>
        <div class="logo">
            <a id="logo" href="index.html#home">
                🎮 Gaming Cafe
            </a>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="more-games.html">Games</a>
            <a href="index.html#membership">Membership</a>
            <a href="index.html#tournament">Tournament</a>
            <a href="index.html#gallery">Gallery</a>
            <a href="index.html#contact">Contact</a>
        </nav>
    </header>

    <div class="register-box">
        <h2>Tournament Registration</h2>
        <form action="tournament-response.html">
            <input type="text" name="name" placeholder="Enter Your Name" required>
            <input type="email" name="email" placeholder="Enter Your Email" required>
            <input type="text" name="phone" placeholder="Phone Number" required>
            
            <select name="tournament" required>
                <option value="bgmi">BGMI Battle Only</option>
            </select>

            <input type="text" name="username" placeholder="Enter Your Game Username" required>
            <button type="submit">Register Now</button>
        </form>
    </div>

</body>
</html>
